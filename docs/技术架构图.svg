<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:12}
      .title{font-size:28px;font-weight:700;fill:#111827;text-anchor:middle}
      .subtitle{font-size:14px;fill:#64748b;text-anchor:middle}
      .laneTitle{font-size:18px;font-weight:700;fill:#0f172a}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:8}
      .api{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}
      .stream{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:8}
      .core{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:8}
      .model{fill:#1e293b;stroke:#1e293b;stroke-width:1.5;rx:8}
      .bt{font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle}
      .bs{font-size:12px;fill:#475569;text-anchor:middle}
      .white{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle}
      .smallwhite{font-size:11px;fill:#cbd5e1;text-anchor:middle}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <text class="title" x="600" y="38">尘安智眼 v4 · 双入口技术架构</text>
  <text class="subtitle" x="600" y="64">Streamlit 保留为最终展示，FastAPI + Vue 提供可独立运行的前后端分离入口</text>

  <rect class="lane" x="40" y="84" width="1120" height="112"/>
  <text class="laneTitle" x="62" y="112">① 使用入口</text>
  <rect class="stream" x="100" y="130" width="310" height="48"/>
  <text class="bt" x="255" y="151">Streamlit · app.py</text>
  <text class="bs" x="255" y="169">最终展示 / 离线演示 / 会话台账</text>
  <rect class="box" x="475" y="130" width="250" height="48"/>
  <text class="bt" x="600" y="151">现场照片 · CSV · 单点数据</text>
  <text class="bs" x="600" y="169">统一输入，复用同一领域逻辑</text>
  <rect class="api" x="790" y="130" width="310" height="48"/>
  <text class="bt" x="945" y="151">Vue 3 + Vite</text>
  <text class="bs" x="945" y="169">独立前端 / Apple 简约分隔</text>

  <rect class="lane" x="40" y="224" width="1120" height="128"/>
  <text class="laneTitle" x="62" y="252">② 适配与 API 层</text>
  <rect class="stream" x="100" y="270" width="310" height="56"/>
  <text class="bt" x="255" y="293">Streamlit 页面编排</text>
  <text class="bs" x="255" y="312">直接调用 core，保留演示链路</text>
  <rect class="api" x="445" y="270" width="310" height="56"/>
  <text class="bt" x="600" y="293">FastAPI + Pydantic</text>
  <text class="bs" x="600" y="312">校验 · 错误映射 · request_id · CORS</text>
  <rect class="box" x="790" y="270" width="310" height="56"/>
  <text class="bt" x="945" y="293">backend/services</text>
  <text class="bs" x="945" y="312">视觉 · 传感器 · 知识库 · 报告适配</text>

  <rect class="lane" x="40" y="380" width="1120" height="170"/>
  <text class="laneTitle" x="62" y="408">③ 共享领域层 · core/</text>
  <rect class="core" x="75" y="430" width="205" height="82"/>
  <text class="bt" x="177" y="454">analytics</text><text class="bs" x="177" y="475">质控 · 阈值 · 趋势</text><text class="bs" x="177" y="493">WBGT · 呼吸带折算</text>
  <rect class="core" x="305" y="430" width="205" height="82"/>
  <text class="bt" x="407" y="454">knowledge</text><text class="bs" x="407" y="475">本地/GitHub 规范</text><text class="bs" x="407" y="493">精要 · 检索 · 映射</text>
  <rect class="core" x="535" y="430" width="205" height="82"/>
  <text class="bt" x="637" y="454">llm + prompts</text><text class="bs" x="637" y="475">视觉/数据黄金 Prompt</text><text class="bs" x="637" y="493">演示模式与 JSON 契约</text>
  <rect class="core" x="765" y="430" width="205" height="82"/>
  <text class="bt" x="867" y="454">overlay + charts</text><text class="bs" x="867" y="475">PIL 检测框 · Plotly</text><text class="bs" x="867" y="493">风险图与可视化</text>
  <rect class="core" x="995" y="430" width="130" height="82"/>
  <text class="bt" x="1060" y="454">reporting</text><text class="bs" x="1060" y="475">Markdown</text><text class="bs" x="1060" y="493">JSON</text>

  <rect class="lane" x="40" y="578" width="1120" height="112"/>
  <text class="laneTitle" x="62" y="606">④ 统一输出</text>
  <rect class="box" x="100" y="625" width="260" height="42"/><text class="bt" x="230" y="651">视觉隐患工单</text>
  <rect class="box" x="390" y="625" width="260" height="42"/><text class="bt" x="520" y="651">传感器风险与工艺窗口</text>
  <rect class="box" x="680" y="625" width="260" height="42"/><text class="bt" x="810" y="651">规范条款与知识检索</text>
  <rect class="box" x="970" y="625" width="130" height="42"/><text class="bt" x="1035" y="651">报告下载</text>

  <rect x="40" y="720" width="1120" height="58" rx="12" fill="#1e293b"/>
  <text class="white" x="600" y="746">同一套 core 规则 · 两种入口 · 一条处置闭环</text>
  <text class="smallwhite" x="600" y="765">无 API Key 时 Streamlit 与 FastAPI 均可使用演示数据；台账当前为会话内存，不引入数据库</text>

  <path class="flow" d="M255,178 V268"/>
  <path class="flow" d="M945,178 V268"/>
  <path class="dash" d="M600,178 V268"/>
  <path class="flow" d="M255,326 C255,380 177,392 177,428"/>
  <path class="flow" d="M600,326 V428"/>
  <path class="flow" d="M945,326 C945,380 867,392 867,428"/>
  <path class="flow" d="M177,512 C177,570 230,590 230,623"/>
  <path class="flow" d="M407,512 C407,570 520,590 520,623"/>
  <path class="flow" d="M637,512 C637,570 810,590 810,623"/>
  <path class="flow" d="M867,512 C867,570 1035,590 1035,623"/>
</svg>
